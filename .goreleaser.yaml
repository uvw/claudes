# Release builds. The release workflow runs `goreleaser release --skip=publish`
# on a tag and publishes the result itself; locally:
#   goreleaser build --snapshot --clean   # try a build of every target
version: 2

project_name: claudes

builds:
  - main: ./cmd/claudes
    env:
      - CGO_ENABLED=0
    goos: [darwin, linux, windows]
    goarch: [amd64, arm64]
    flags: [-trimpath]
    # The commit's time, not the build's, so two builds of a tag match.
    mod_timestamp: "{{ .CommitTimestamp }}"
    ldflags:
      - -s -w -X github.com/uvw/claudes/internal/cli.Version={{.Version}} -X github.com/uvw/claudes/internal/cli.Commit={{.ShortCommit}}

archives:
  - formats: [tar.gz]
    name_template: "{{ .ProjectName }}_{{ .Version }}_{{ .Os }}_{{ .Arch }}"
    builds_info:
      mtime: "{{ .CommitDate }}"
    files:
      - src: README.md
        info:
          mtime: "{{ .CommitDate }}"
      - src: LICENSE
        info:
          mtime: "{{ .CommitDate }}"
      - src: docs/third-party-notices.txt
        strip_parent: true
        info:
          mtime: "{{ .CommitDate }}"
    format_overrides:
      - goos: windows
        formats: [zip]

checksum:
  name_template: checksums.txt
  # The release workflow copies these into dist/ beside the archives.
  extra_files:
    - glob: ./install/install.sh
    - glob: ./install/install.ps1

# One SPDX SBOM per archive, made with syft, which must be on PATH.
sboms:
  - artifacts: archive

# release-please writes the changelog and the release notes.
changelog:
  disable: true
