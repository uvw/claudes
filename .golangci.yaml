# golangci-lint configuration: https://golangci-lint.run/usage/configuration/
# The default linters (errcheck, govet, ineffassign, staticcheck, unused), with
# the exclusions below. CI runs staticcheck on its own too.
version: "2"

linters:
  settings:
    errcheck:
      exclude-functions:
        # Prints a table to the terminal, which has nothing to do when the write
        # fails, like the fmt.Fprint calls the preset below allows.
        - github.com/uvw/claudes/internal/style.Table
        # Fails only for a flag that does not exist, which the completion tests
        # would show.
        - (*github.com/spf13/cobra.Command).RegisterFlagCompletionFunc
        # Closes a handle opened to read a process's details, as Close does for
        # the files the preset below allows.
        - golang.org/x/sys/windows.CloseHandle
  exclusions:
    presets:
      # Unchecked Close, Flush, Remove, and print calls. CodeQL checks the one
      # that loses data: closing a file that was written.
      - std-error-handling
    rules:
      # Test setup that fails shows up in the next assertion.
      - path: _test\.go
        linters: [errcheck]
