version: 2

updates:
  - package-ecosystem: gomod
    directory: /
    schedule:
      interval: weekly
    # A week for a bad release to be noticed and yanked before it is proposed.
    # Security updates are not delayed.
    cooldown:
      default-days: 7
    # A dependency changes the shipped binary, so its update is a fix that
    # makes a release.
    commit-message:
      prefix: fix
      include: scope
    groups:
      # golang.org/x modules move together and are tested together.
      golang-x:
        patterns: ["golang.org/x/*"]
      gomod:
        patterns: ["*"]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    commit-message:
      prefix: ci
    groups:
      actions:
        patterns: ["*"]
