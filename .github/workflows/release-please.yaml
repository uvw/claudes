name: Release Please

# Keeps a release pull request open with the next version and its changelog,
# worked out from the Conventional Commits on main. Merging it creates the tag
# and a draft release, then hands off to the release workflow.
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions: {}

concurrency:
  group: release-please
  cancel-in-progress: false

jobs:
  release-please:
    name: Release pull request
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
      pull-requests: write
    outputs:
      created: ${{ steps.release.outputs.release_created }}
      tag: ${{ steps.release.outputs.tag_name }}
    steps:
      - id: release
        uses: googleapis/release-please-action@45996ed1f6d02564a971a2fa1b5860e934307cf7 # v5.0.0
        with:
          # A pull request opened with GITHUB_TOKEN starts no workflows, so its
          # required check would never run. RELEASE_PLEASE_TOKEN is a
          # fine-grained token or app token that can open pull requests.
          token: ${{ secrets.RELEASE_PLEASE_TOKEN || github.token }}
          config-file: .github/release-please-config.json
          manifest-file: .github/release-please-manifest.json
      # release-please writes the changelog with long lines; this formats the
      # open release pull request's copy the way the rest of the docs are. The
      # script finds the pull request itself: release-please reports one only
      # when it rewrote it, which a hidden commit type such as ci does not.
      - name: Check out main for the formatting script
        if: steps.release.outputs.release_created != 'true'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install Prettier
        if: steps.release.outputs.release_created != 'true'
        run: npm ci --prefix tools --ignore-scripts
      - name: Format the changelog in the release pull request
        if: steps.release.outputs.release_created != 'true'
        env:
          TOKEN: ${{ secrets.RELEASE_PLEASE_TOKEN || github.token }}
          GH_TOKEN: ${{ github.token }}
          # The runner has no git identity; the commit is the workflow's own.
          GIT_AUTHOR_NAME: github-actions[bot]
          GIT_AUTHOR_EMAIL: 41898282+github-actions[bot]@users.noreply.github.com
          GIT_COMMITTER_NAME: github-actions[bot]
          GIT_COMMITTER_EMAIL: 41898282+github-actions[bot]@users.noreply.github.com
        run: bash .github/workflows/hack/format-changelog.sh

  release:
    name: Release
    needs: release-please
    if: needs.release-please.outputs.created == 'true'
    # actionlint 1.7.12 rejects the $/ form zizmor suggests.
    uses: ./.github/workflows/release.yaml # zizmor: ignore[self-repository]
    with:
      tag: ${{ needs.release-please.outputs.tag }}
    permissions:
      contents: write
      id-token: write
      attestations: write
    secrets:
      HOMEBREW_TAP_TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN }}
      WINGET_TOKEN: ${{ secrets.WINGET_TOKEN }}
