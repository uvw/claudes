name: CI

on:
  push:
    branches: [main]
  pull_request:
    # edited reruns the checks when the title changes, since the title becomes
    # the commit on main.
    types: [opened, synchronize, reopened, edited]
  workflow_dispatch:
  # The release workflow runs these checks on the tagged commit before it builds.
  workflow_call:
    inputs:
      ref:
        description: The commit, branch, or tag to check.
        required: true
        type: string

permissions:
  contents: read

# A new push to a pull request replaces its older run. Every other run gets a
# group of its own: GitHub cancels a pending run when a newer one joins its
# group, even without cancel-in-progress, so a shared group would drop the
# result of a commit on main.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  COVERAGE_FLOOR: "80"
  GORELEASER_VERSION: v2.20.2
  GITLEAKS_VERSION: 8.30.1
  GITLEAKS_SHA256: 551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb

jobs:
  go:
    name: Go (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        # procs, the claude agents handoff, and resume commands have a file per
        # platform. Runner images are pinned so an image change is a deliberate
        # update, not a surprise.
        # macOS runs on Intel: GitHub's Apple silicon runners are short on
        # capacity and drop queued jobs, and no claudes code differs between
        # the two. Releases still test the arm64 archive on Apple silicon.
        os: [ubuntu-24.04, ubuntu-24.04-arm, macos-15-intel, windows-2025, windows-11-arm]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # A release run checks the tag it builds.
          ref: ${{ inputs.ref || github.ref }}
          # macOS also builds the snapshot, and goreleaser reads the history
          # for its version.
          fetch-depth: ${{ runner.os != 'macOS' && 1 || 0 }}
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          # macOS also builds the release binary, which uses no cache, so a
          # poisoned cache cannot reach it.
          cache: ${{ runner.os != 'macOS' }}
          cache-dependency-path: |
            go.sum
            tools/go.sum
      # The assignment fails the step when gofmt cannot parse a file, which it
      # reports on stderr alone.
      - name: gofmt
        if: runner.os != 'Windows'
        run: |
          unformatted=$(gofmt -l .)
          [[ -z $unformatted ]] || { echo "::error::gofmt would change these files:"; echo "$unformatted"; exit 1; }
      - name: go.mod and go.sum are tidy
        run: go mod tidy -diff
      - name: tools/go.mod and tools/go.sum are tidy
        run: go -C tools mod tidy -diff
      - run: go mod verify
      - run: go vet ./...
      # Go has no race detector for Windows on Arm.
      - name: Tests, with the race detector and coverage
        shell: bash
        run: |
          race=(-race)
          [[ $RUNNER_OS != Windows || $RUNNER_ARCH != ARM64 ]] || race=()
          go test "${race[@]}" -coverprofile=coverage.out ./...
      - name: Coverage floor
        if: runner.os == 'Linux' && runner.arch == 'X64'
        run: bash .github/workflows/hack/coverage.sh "$COVERAGE_FLOOR" coverage.out
      # PowerShell splits -modfile=tools/go.mod at the dot.
      # golangci-lint leaves staticcheck to this step (.golangci.yaml).
      - shell: bash
        run: go tool -modfile=tools/go.mod staticcheck ./...
      # The weekly Security workflow runs govulncheck too, for vulnerability
      # reports that arrive between pushes.
      - if: runner.os == 'Linux' && runner.arch == 'X64'
        run: go tool -modfile=tools/go.mod govulncheck ./...
      # macOS runners can take most of an hour to arrive, so the macOS release
      # build smoke runs here, in the one macOS job, instead of in the smoke
      # job.
      # The setup-go cache is off on macOS, which zizmor cannot read from the
      # expression, and this snapshot is never published.
      - name: Release build (macOS)
        if: runner.os == 'macOS'
        uses: goreleaser/goreleaser-action@a4f02ab5355a589de60d917a659ce617ed19b3de # v7.3.0 # zizmor: ignore[cache-poisoning]
        with:
          version: ${{ env.GORELEASER_VERSION }}
          args: build --snapshot --clean --single-target --output dist/claudes
      - name: Run the release binary (macOS)
        if: runner.os == 'macOS'
        run: bash .github/workflows/hack/smoke.sh dist/claudes
      - name: Install it with install.sh (macOS)
        if: runner.os == 'macOS'
        run: bash .github/workflows/hack/install-test.sh dist/claudes

  smoke:
    name: Release build smoke (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        # macOS runs these steps in its Go job.
        os: [ubuntu-24.04, windows-2025]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.ref || github.ref }}
          # goreleaser reads the history for the snapshot version.
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          # The release build uses no cache, so this check matches it.
          cache: false
      - name: The goreleaser config is valid
        if: runner.os == 'Linux'
        uses: goreleaser/goreleaser-action@a4f02ab5355a589de60d917a659ce617ed19b3de # v7.3.0
        with:
          version: ${{ env.GORELEASER_VERSION }}
          args: check
      - uses: goreleaser/goreleaser-action@a4f02ab5355a589de60d917a659ce617ed19b3de # v7.3.0
        with:
          version: ${{ env.GORELEASER_VERSION }}
          args: build --snapshot --clean --single-target --output dist/claudes${{ runner.os == 'Windows' && '.exe' || '' }}
      - name: Run the release binary
        shell: bash
        run: bash .github/workflows/hack/smoke.sh "dist/claudes${{ runner.os == 'Windows' && '.exe' || '' }}"
      - name: Install it with install.sh
        if: runner.os != 'Windows'
        run: bash .github/workflows/hack/install-test.sh dist/claudes
      - name: Install it with install.ps1
        if: runner.os == 'Windows'
        shell: pwsh
        run: .github/workflows/hack/install-test.ps1 -Binary dist/claudes.exe

  lint:
    name: golangci-lint (${{ matrix.goos }})
    strategy:
      fail-fast: false
      matrix:
        # The platform files only build for their own GOOS, so each is linted.
        goos: [linux, darwin, windows]
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.ref || github.ref }}
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - uses: golangci/golangci-lint-action@ba0d7d2ec06a0ea1cb5fa41b2e4a3ab91d21278a # v9.3.0
        env:
          GOOS: ${{ matrix.goos }}
        with:
          version: v2.15.0

  licenses:
    name: Licenses and notices
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.ref || github.ref }}
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache-dependency-path: |
            go.sum
            tools/go.sum
      - name: Allowed licenses, and docs/third-party-notices.txt is current
        run: go run hack/notices.go --check

  docs:
    name: Markdown
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.ref || github.ref }}
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: tools/.nvmrc
          package-manager-cache: false
      - run: npm ci --prefix tools --ignore-scripts
      - run: tools/node_modules/.bin/prettier --check .
      # .markdownlint-cli2.yaml lists the files.
      - run: tools/node_modules/.bin/markdownlint-cli2
      # The release notes are Markdown, checked with these same tools.
      - name: The release notes scripts pass their tests
        run: bash .github/workflows/hack/release-notes.sh test

  # zizmor and gitleaks fail this workflow on a finding, so a finding blocks
  # the merge. The weekly Security workflow also sends zizmor's findings to
  # code scanning.
  zizmor:
    name: Workflow audit (zizmor)
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.ref || github.ref }}
          persist-credentials: false
      - uses: zizmorcore/zizmor-action@45d7276c9ca790aabd705e31ca99c6185c3e76dd # v0.8.1
        with:
          # Pinned, so a new zizmor release cannot turn this job red on its own.
          version: 1.32.0
          # Plain output, with a failing exit code on a finding. The SARIF
          # mode exits 0 and needs a token that can write to code scanning.
          advanced-security: false
          # Offline, so a new advisory against a pinned action cannot turn a
          # pull request or a release red on its own. The weekly Security run
          # audits online and sends advisories to code scanning.
          online-audits: false

  gitleaks:
    name: Secrets (gitleaks)
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.ref || github.ref }}
          # The whole history, not only the newest commit.
          fetch-depth: 0
          persist-credentials: false
      - name: Install gitleaks, checked against its published hash
        run: |
          archive="gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          curl -fsSL --retry 3 -o "$archive" \
            "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/$archive"
          echo "${GITLEAKS_SHA256}  $archive" | sha256sum --check --strict
          tar -xzf "$archive" gitleaks
          sudo install gitleaks /usr/local/bin/gitleaks
      - name: Scan the history
        run: gitleaks git --redact .

  # Pull requests squash-merge, so the title becomes the commit on main that
  # release-please reads for the version and the changelog.
  pr-title:
    name: Pull request title
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: The title is a Conventional Commit
        env:
          TITLE: ${{ github.event.pull_request.title }}
          # The pull request's author, not github.actor, who may be anyone that
          # reran the checks.
          AUTHOR: ${{ github.event.pull_request.user.login }}
        run: |
          pattern='^(feat|fix|perf|refactor|docs|test|ci|chore)(\([a-z0-9-]+\))?!?: [a-z].*[^.]$'
          [[ "$TITLE" =~ $pattern ]] && exit 0
          # Dependabot writes "Bump" with a capital, and has no setting to change it.
          dependabot='^(fix|ci)\(deps\): Bump '
          [[ "$AUTHOR" == "dependabot[bot]" && "$TITLE" =~ $dependabot ]] && exit 0
          echo "::error::Use type(scope): lowercase imperative subject, such as fix(cli): skip pinned sessions in gc"
          exit 1

  # The one required check. A skipped or cancelled job would otherwise count
  # as passing; only the title check may be skipped, outside pull requests.
  all-green:
    name: CI (all green)
    if: always()
    needs: [go, smoke, lint, licenses, docs, zizmor, gitleaks, pr-title]
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Every job succeeded
        env:
          NEEDS: ${{ toJSON(needs) }}
        run: |
          echo "$NEEDS" | jq -e 'to_entries | all(.value.result == "success"
            or (.key == "pr-title" and .value.result == "skipped"))'
